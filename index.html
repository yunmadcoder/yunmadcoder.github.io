<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="구글 스타일 시작 홈페이지 - 날씨, 검색, 명언을 한눈에">
  <title>시작 페이지 | 검색 · 날씨 · 명언</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>

  <!-- SDU 로고 (좌측 상단) -->
  <nav class="top-nav" aria-label="대학교 링크">
    <a href="https://www.sdu.ac.kr" target="_blank" rel="noopener noreferrer" class="sdu-logo-link" id="sdu-logo" title="서울디지털대학교 홈페이지">
      <div class="sdu-logo">
        <div class="sdu-logo-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#1B3A6B"/>
            <path d="M10 28V14l10-6 10 6v14" stroke="#8ab4f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 28h20" stroke="#8ab4f8" stroke-width="2" stroke-linecap="round"/>
            <rect x="16" y="20" width="8" height="8" rx="1" stroke="#fdd663" stroke-width="1.5"/>
            <line x1="20" y1="20" x2="20" y2="28" stroke="#fdd663" stroke-width="1"/>
            <line x1="16" y1="24" x2="24" y2="24" stroke="#fdd663" stroke-width="1"/>
            <circle cx="20" cy="14" r="2" fill="#8ab4f8"/>
          </svg>
        </div>
      </div>
    </a>
  </nav>

  <main class="main-container">

    <!-- 시간 & 날짜 -->
    <section class="datetime-section" aria-label="현재 시간">
      <div class="current-time" id="current-time">--:--</div>
      <div class="current-date" id="current-date">날짜를 불러오는 중...</div>
    </section>

    <!-- 구글 로고 -->
    <section class="logo-section" aria-label="구글 로고">
      <div class="google-logo">
        <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
      </div>
    </section>

    <!-- 검색창 -->
    <section class="search-section" aria-label="검색">
      <form onsubmit="performSearch(event)" autocomplete="off">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-bar"
            placeholder="Google 검색 또는 URL 입력"
            oninput="handleSearchInput()"
            autofocus
          >
          <button type="button" id="search-clear" class="search-clear" onclick="clearSearch()" aria-label="검색어 지우기">✕</button>
        </div>
        <div class="search-buttons">
          <button type="submit" class="search-btn" id="btn-search">Google 검색</button>
          <button type="button" class="search-btn" id="btn-lucky" onclick="luckySearch()">I'm Feeling Lucky</button>
        </div>
      </form>
    </section>

    <!-- 날씨 -->
    <section class="weather-section" aria-label="날씨 정보">
      <div class="weather-cards">
        <div class="weather-card seoul" id="weather-seoul">
          <div class="weather-loading">
            <div class="spinner"></div>
            날씨 불러오는 중...
          </div>
        </div>
        <div class="weather-card jeju" id="weather-jeju">
          <div class="weather-loading">
            <div class="spinner"></div>
            날씨 불러오는 중...
          </div>
        </div>
      </div>
    </section>

    <!-- 명언 -->
    <section class="quote-section" aria-label="오늘의 명언">
      <div class="quote-container">
        <span class="quote-mark">"</span>
        <p class="quote-text" id="quote-text">명언을 불러오는 중...</p>
        <p class="quote-author" id="quote-author"></p>
        <button class="quote-refresh" onclick="showRandomQuote()" aria-label="다른 명언 보기">
          ↻ 다른 명언
        </button>
      </div>
    </section>

  </main>

  <footer class="footer">
    © 2026 My Homepage
  </footer>

  <script src="script.js"></script>
</body>
</html>
